<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Contact White Water Rafting Company — ask questions, make reservations, or send us your feedback." />
  <meta name="author" content="Abraham Luutu" />
  <link rel="stylesheet" href="styles/rafting.css">
  <title>Contact Us | White Water Rafting Company</title>
</head>

<body>
  <header class="header">
    <div class="logo">
      <a href="index.html">
        <img src="images/logo.png" alt="White Water Rafting Company logo" width="120">
      </a>
    </div>
    <nav class="nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="trips.html">Trips</a></li>
        <li><a href="contact.html" class="active">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="company-header">
      <h1>White Water Rafting Company</h1>
      <p>123 Main River Street</p>
      <p>Kolob, California</p>
      <p>+1 999 999 9999</p>
      <p><a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
    </section>

    <section class="contact-section">
      <div class="map-container">
        <iframe title="Map showing the location of White Water Rafting Company"
          src="https://www.openstreetmap.org/export/embed.html?bbox=-119.0%2C37.0%2C-118.9%2C37.1&amp;layer=mapnik"
          loading="lazy">
        </iframe>
      </div>

      <form class="contact-form" action="#" method="post">
        <div class="form-row">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Placeholder" required>
        </div>

        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Placeholder" required>
        </div>

        <div class="form-row">
          <span class="form-label">Message<br>Purpose</span>
          <div class="radio-group">
            <label for="purpose-general">
              <input type="radio" id="purpose-general" name="purpose" value="general" checked>
              General Inquiry
            </label>
            <label for="purpose-reservation">
              <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
              Reservation Question
            </label>
            <label for="purpose-suggestion">
              <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
              Website Suggestion
            </label>
          </div>
        </div>

        <div class="form-row form-row-stack">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Type here" rows="4"></textarea>
        </div>

        <div class="newsletter-check">
          <label for="newsletter">
            <input type="checkbox" id="newsletter" name="newsletter" checked>
            Please Subscribe me to the monthly newsletter
          </label>
        </div>

        <button type="submit">Get in Touch!</button>
      </form>
    </section>

    <section class="employees">
      <h2>We Are Here to Serve You</h2>
      <div class="employee-grid">
        <figure>
          <img src="images/sarah.jpg" alt="Sarah, Lead Guide at White Water Rafting Company">
          <figcaption>Sarah – Lead Guide</figcaption>
        </figure>
        <figure>
          <img src="images/mike.jpg" alt="Mike, Safety Expert at White Water Rafting Company">
          <figcaption>Mike – Safety Expert</figcaption>
        </figure>
        <figure>
          <img src="images/lisa.jpg" alt="Lisa, River Specialist at White Water Rafting Company">
          <figcaption>Lisa – River Specialist</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 White Water Rafting Company | Abraham Luutu</p>
    <nav class="socialmedia">
      <a href="https://facebook.com"><img src="images/facebook.png"
          alt="Follow White Water Rafting Company on Facebook" width="40"></a>
      <a href="https://twitter.com"><img src="images/twitter.png"
          alt="Follow White Water Rafting Company on Twitter" width="40"></a>
      <a href="https://instagram.com"><img src="images/instagram.png"
          alt="Follow White Water Rafting Company on Instagram" width="40"></a>
    </nav>
  </footer>
</body>

</html>
